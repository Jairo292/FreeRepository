<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>  
    <h2>Iniciar Sesion</h2>
    <form id="loginForm" method="POST">  
        <label>Correo:</label>
    <br>
    <input type="email" id="usuario" required autocomplete="email" placeholder="Ingresa tu correo">
    <br><br>

    <label>Contraseña:</label>
    <br>
    <input type="password" id="password" required autocomplete="current-password"  placeholder="Ingresa tu contraseña">
    <br><br>

    <button type="submit">Confirmar</button>

    </form>
    <script src="../JS/login.js"></script>
</body>



</html>
